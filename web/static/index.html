<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{TITLE}}</title>
  <script src="{{PYXEL_JS}}"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body data-width="{{WIDTH}}" data-height="{{HEIGHT}}">
  <header>
    <strong>{{TITLE}}</strong>
    <nav aria-label="Pages"><a href="./">Game</a> <a href="?app=debug">Pointer check</a>
      <button id="fullscreen">Fullscreen</button></nav>
  </header>
  <main id="stage"><div id="pyxel-screen"></div></main>
  <p id="status" role="status">Loading runtime. Then click or touch the game to start.</p>
  <p id="help">Touch, mouse, and keyboard all work. {{RUNTIME_NOTE}}</p>
  <script type="module" src="launcher.mjs"></script>
</body>
</html>
