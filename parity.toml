# Runtime parity manifest. The single source of truth for what each runtime implements.
# `just parity` checks it and writes docs/concepts/parity.md. Rules: docs/concepts/layers.md.
#
# Each capability:
#   id       layer.name. Layers: contract, core, host, dev.
#   summary  One line.
#   fixture  Shared fixture that proves the behaviour (contract layer).
#   debt     A known gap in the proof, listed on the parity page.
#   specific true when the capability exists because of one runtime (the ladder rule skips it).
#   python, lua, csharp = { status, at, reason, since }
#     status  yes | planned | native | none | undecided
#     at      "file:Symbol" (or a list). Paths are relative to python/src/nightengine/, lua/ or csharp/.
#             Symbol may be Class.member, or "literal text" in quotes. A bare file checks that it exists.
#     reason  Required unless status is yes.
#     since   Engine version that recorded an undecided status. The check fails after the next release.

# Files that hold no capability of their own.
[ignore]
python = ["__init__.py", "host/__init__.py"]
lua = ["class.lua", "json.lua", "py.lua"]
csharp = []

