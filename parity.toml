# Runtime parity manifest. `just parity` checks it and writes docs/concepts/parity.md.
# The rules are in docs/concepts/layers.md.
#
# Each capability:
#   id        layer.name. Layers: contract, core, host, dev.
#   summary   One line.
#   api       Contract and core: canonical Python names, `module.name` or `module.Class.member`.
#             Lua uses the same names. C# uses PascalCase: `rng.Rng.randint` -> `Rng.Randint`,
#             `trace.digest` -> `Trace.Digest`, `inputs.UP` -> `Inputs.Up`.
#   fixture   Contract: the shared fixture that proves the behaviour.
#   debt      Contract: a known gap in the proof.
#   specific  Core: true when the capability exists only because of one runtime.
#   python, lua, csharp = { status, at, reason, plan }
#             Not used in the contract layer: every runtime implements the contract.
#     status  yes | planned | native | none | undecided
#     at      Host and dev: "file:Symbol" or a list, relative to python/src/nightengine/, lua/ or csharp/.
#             Symbol may be Class.member, or "literal text" in quotes. Names may differ per runtime here.
#     reason  Required unless status is yes.
#     plan    Required for planned at release: the doc that holds the work.

[ignore]
python = ["__init__.py", "host/__init__.py"]
lua = ["class.lua", "json.lua", "py.lua"]
csharp = []

# ---------------------------------------------------------------------------------------------- contract

[[capability]]
id = "contract.buttons"
summary = "The eight engine button bits: UP 1 … MENU 128"
fixture = "behavior.json"
api = ["inputs.UP", "inputs.DOWN", "inputs.LEFT", "inputs.RIGHT", "inputs.A", "inputs.B", "inputs.C", "inputs.MENU", "inputs.ALL"]

[[capability]]
id = "contract.input-edges"
summary = "Held, pressed and repeat state from one int per frame"
fixture = "behavior.json"
debt = "The fixture has no held button long enough to fire a repeat."
api = ["inputs.Input", "inputs.Input.down", "inputs.Input.hit", "inputs.Input.nav", "inputs.InputTracker", "inputs.InputTracker.feed"]

[[capability]]
id = "contract.step-order"
summary = "Game.step: filter, track, effects, before hook, top scene, after hook, frame + 1, return cues"
fixture = "behavior.json"
debt = "C# has no effects to tick (see core.fx). The fixture uses no effects."
api = ["core.Game", "core.Game.step", "core.Game.before_scene", "core.Game.after_scene", "core.Game.push", "core.Game.pop"]

[[capability]]
id = "contract.cues"
summary = "Sound cue names returned by each step and cleared after it"
fixture = "behavior.json"
api = ["core.Game.cue"]

[[capability]]
id = "contract.scene-stack"
summary = "Push, pop, replace and the visible scenes under an overlay"
debt = "No shared fixture. Each suite tests the stack on its own."
api = ["scene.Scene", "scene.Scene.update", "scene.SceneStack", "scene.SceneStack.top", "scene.SceneStack.push", "scene.SceneStack.pop", "scene.SceneStack.replace", "scene.SceneStack.visible"]

[[capability]]
id = "contract.rng"
summary = "Portable seeded RNG"
fixture = "rng.json"
api = ["rng.Rng", "rng.Rng.next", "rng.Rng.randint", "rng.Rng.getrandbits", "rng.Rng.random"]

[[capability]]
id = "contract.trace"
summary = "Canonical snapshot text and CRC-32 digest"
fixture = "rng.json"
api = ["trace.canon", "trace.digest"]

[[capability]]
id = "contract.replay-json"
summary = "Recording JSON: seed, width, inputs, sparse pointers and events"
fixture = "events.json"
api = ["replay.Recording", "replay.Recording.add", "replay.Recording.at", "replay.Recording.to_json", "replay.Recording.from_json"]

[[capability]]
id = "contract.events"
summary = "Host events: text input recorded per frame and fed on playback"
fixture = "events.json"
api = ["replay.Recording.events_at"]

[[capability]]
id = "contract.dev-pairs"
summary = "`just dev` key=value pairs as \"dev key=value\" host events, read by Input.dev"
fixture = "dev.json"
api = ["inputs.dev_event", "inputs.Input.dev"]

[[capability]]
id = "contract.pointers"
summary = "Pointer kinds, phases and their replay encoding"
debt = "No shared fixture. Replays with pointers are not checked across runtimes."
api = ["pointer.Pointer", "pointer.encode", "pointer.decode"]

[[capability]]
id = "contract.targets"
summary = "Targets and the pointer kinds that each accepts"
debt = "No shared fixture for pointer filtering by target."
