name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: 'recursive' # Ensure submodules like SDL are checked out

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json

    - name: Check Formatting
      run: dotnet format --verify-no-changes --verbosity diagnostic Night.sln

    - name: Restore dependencies
      run: dotnet restore Night.sln

    - name: Build Solution
      run: dotnet build Night.sln --configuration Release --no-restore

    - name: Run Tests
      run: dotnet test tests/NightTest.csproj --no-build --configuration Release --filter "TestType=Automated"
